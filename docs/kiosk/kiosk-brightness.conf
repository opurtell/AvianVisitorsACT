# /etc/default/kiosk-brightness - read every run, no restart needed.
# Backlight percent in full daylight and at night.
DAY=90
NIGHT=10
# Fade happens while the sun is between these elevations (degrees).
# -6 is civil twilight; widen the range for a slower fade.
ELEV_LOW=-6
ELEV_HIGH=6
# Site (matches the BirdNET configuration contract).
LAT=-35.28
LON=149.13
