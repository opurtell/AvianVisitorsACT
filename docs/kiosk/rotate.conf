# /etc/triggerhappy/triggers.d/rotate.conf - Windows-style rotation hotkeys.
# Any USB/Bluetooth keyboard or Type Cover; triggerhappy's udev rule picks up
# keyboards plugged in after boot.
KEY_RIGHT+KEY_LEFTCTRL+KEY_LEFTALT  1  /usr/local/bin/kiosk-rotate cw
KEY_LEFT+KEY_LEFTCTRL+KEY_LEFTALT   1  /usr/local/bin/kiosk-rotate ccw
KEY_UP+KEY_LEFTCTRL+KEY_LEFTALT     1  /usr/local/bin/kiosk-rotate reset
