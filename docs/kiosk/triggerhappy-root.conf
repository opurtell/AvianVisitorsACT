# /etc/systemd/system/triggerhappy.service.d/root.conf
# Run triggers as root (the packaged unit drops to nobody, which cannot set
# the mixer or write /var/lib/alsa/asound.state).
[Service]
ExecStart=
ExecStart=/usr/sbin/thd --triggers /etc/triggerhappy/triggers.d/ --socket /run/thd.socket --deviceglob /dev/input/event*
